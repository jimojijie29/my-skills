<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TOPIC}}产业链投研看板 · 2026-06-15</title>
<style>
:root{
  --bg:#050a14;--panel:#0a1322;--panel2:#0f1a2e;--border:#1c2a44;
  --text:#e8efff;--muted:#7a8caa;--accent:#3b82f6;--accent2:#60a5fa;
  --warm:#fbbf24;--green:#10b981;--red:#ef4444;--yellow:#eab308;--purple:#a78bfa;--cyan:#22d3ee;
  --g1:linear-gradient(135deg,#3b82f6,#60a5fa);
  --g2:linear-gradient(135deg,#0ea5e9,#22d3ee);
  --g3:linear-gradient(135deg,#a78bfa,#60a5fa);
  --glow:0 0 18px rgba(59,130,246,0.22);
  --glow2:0 0 14px rgba(34,211,238,0.18);
  --glow3:0 0 18px rgba(167,139,250,0.20);
  --radius:12px;--radius-sm:8px;
}
[data-theme="light"]{--bg:#f1f5fb;--panel:#fff;--panel2:#e6eef9;--border:#bfd1ea;--text:#0c1726;--muted:#4d5e7c;--accent:#1d4ed8;--accent2:#2563eb;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;}
.wrap{max-width:1340px;margin:0 auto;padding:24px 20px 80px;}

/* ── Header ── */
header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border);position:relative;}
header::after{content:"";position:absolute;bottom:-1px;left:0;width:120px;height:2px;background:var(--g1);border-radius:2px;}
h1{font-size:25px;font-weight:800;letter-spacing:.3px;background:var(--g1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
h1 .sub{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:10px;-webkit-text-fill-color:var(--muted);}
.toolbar{display:flex;gap:8px;align-items:center;}
.btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12.5px;transition:all .2s;}
.btn:hover{border-color:var(--accent);color:var(--accent2);box-shadow:var(--glow);}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:10px 20px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;font-size:13.5px;transition:all .18s;border-radius:8px 8px 0 0;}
.tab:hover{color:var(--text);background:rgba(59,130,246,0.06);}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);background:rgba(59,130,246,0.10);}
.tab.serenity.active{color:var(--purple);border-bottom-color:var(--purple);background:rgba(167,139,250,0.10);}
.panel{display:none;}.panel.active{display:block;}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,var(--panel) 0%,rgba(28,42,68,0.8) 100%);border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-bottom:20px;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;top:-40px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(59,130,246,0.10) 0%,transparent 70%);}
.hero h2{font-size:17px;font-weight:700;margin-bottom:10px;background:var(--g1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero .lead{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.7;}
.hero .lead em{color:var(--warm);font-style:normal;font-weight:700;}

/* ── KPI Badges ── */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px;}
.badge{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;position:relative;overflow:hidden;transition:all .2s;}
.badge::before{content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1px;background:var(--g1);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;}
.badge:hover::before{opacity:1;}
.badge:hover{box-shadow:var(--glow);transform:translateY(-2px);}
.badge .num{font-size:24px;font-weight:800;background:var(--g1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;}
.badge .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.4;}

/* ── Cards & Grid ── */
.grid{display:grid;gap:14px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .2s;}
.card:hover{border-color:var(--accent);box-shadow:var(--glow);}

/* ── Section Title ── */
.section-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px;letter-spacing:.3px;}
.section-title::before{content:"";width:4px;height:16px;background:var(--g1);border-radius:2px;flex-shrink:0;}
.section-title.serenity::before{background:var(--g3);}

/* ── Chain ── */
.chain{display:grid;grid-template-columns:1fr;gap:14px;}
.chain-row{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.chain-row h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;}
.chain-row .pct{background:rgba(251,191,36,0.12);color:var(--warm);border:1px solid rgba(251,191,36,0.3);padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
.node{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;cursor:pointer;transition:all .2s;position:relative;}
.node::after{content:"→";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent);opacity:0;font-size:12px;transition:opacity .2s;}
.node:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--glow);}
.node:hover::after{opacity:1;}
.node h4{font-size:12.5px;margin-bottom:5px;color:var(--accent2);font-weight:700;}
.node .desc{font-size:11.5px;color:var(--muted);line-height:1.5;}
.arrow{text-align:center;color:var(--muted);font-size:20px;margin:2px 0;}

/* ── Filters / Chips ── */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center;}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:16px;cursor:pointer;font-size:12px;transition:all .18s;}
.chip:hover{color:var(--text);border-color:var(--accent);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.search{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px;width:200px;outline:none;transition:border-color .2s;}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,0.18);}

/* ── Company Cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(335px,1fr));gap:14px;}
.cc{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:0;cursor:pointer;transition:all .2s;overflow:hidden;}
.cc::before{content:"";display:block;height:3px;background:var(--border);transition:background .2s;}
.cc.tier-card-1::before{background:linear-gradient(90deg,var(--warm),rgba(251,191,36,0.3));}
.cc.tier-card-2::before{background:linear-gradient(90deg,var(--accent),rgba(59,130,246,0.3));}
.cc.tier-card-3::before{background:linear-gradient(90deg,var(--muted),rgba(122,140,170,0.2));}
.cc:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateY(-2px);}
.cc.unlisted{opacity:.82;border-style:dashed;}
.cc-inner{padding:14px;}
.cc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.cc-name{font-size:15px;font-weight:700;}
.cc-code{font-size:11px;color:var(--muted);font-family:Menlo,Consolas,monospace;margin-top:2px;}
.tier{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.3px;}
.tier-1{background:rgba(251,191,36,0.16);color:var(--warm);border:1px solid rgba(251,191,36,0.3);}
.tier-2{background:rgba(59,130,246,0.14);color:var(--accent2);border:1px solid rgba(59,130,246,0.3);}
.tier-3{background:rgba(122,140,170,0.10);color:var(--muted);border:1px solid rgba(122,140,170,0.22);}
.cc-quote{display:flex;gap:10px;font-size:11.5px;flex-wrap:wrap;margin:8px 0 4px;padding:8px;background:var(--panel2);border-radius:6px;}
.cc-quote span{color:var(--muted);}
.cc-quote b{color:var(--text);font-weight:600;margin-left:2px;}
.up{color:#f87171;}.down{color:#34d399;}
.cc-segment{font-size:10.5px;color:var(--muted);margin-bottom:6px;padding:2px 7px;background:rgba(59,130,246,0.08);border-radius:4px;display:inline-block;}
.cc-hl{font-size:12.5px;color:var(--text);margin:8px 0;line-height:1.6;}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--muted);}
.tag.cust{background:rgba(59,130,246,0.10);border-color:rgba(59,130,246,0.4);color:var(--accent2);font-weight:600;}
.tag.choke{background:rgba(167,139,250,0.12);border-color:rgba(167,139,250,0.4);color:var(--purple);font-weight:700;}
.cc-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);}
.cc.open .cc-detail{display:block;}
.cc-detail li{margin-left:16px;margin-top:4px;}

/* ── Valuation Tags ── */
.vtag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;}
.vtag.hot{background:rgba(239,68,68,0.18);color:#f87171;border:1px solid rgba(239,68,68,0.25);}
.vtag.warm{background:rgba(251,191,36,0.14);color:var(--warm);border:1px solid rgba(251,191,36,0.25);}
.vtag.fair{background:rgba(59,130,246,0.14);color:var(--accent2);border:1px solid rgba(59,130,246,0.25);}
.vtag.low{background:rgba(16,185,129,0.14);color:#34d399;border:1px solid rgba(16,185,129,0.25);}

/* ── 52W Position ── */
.cc-pos{font-size:11px;color:var(--muted);margin:4px 0;display:flex;gap:14px;flex-wrap:wrap;}
.cc-pos .bar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--border);position:relative;vertical-align:middle;margin-left:4px;}
.cc-pos .bar i{position:absolute;top:-2px;width:3px;height:9px;border-radius:1px;background:var(--accent2);}

/* ── Stars ── */
.cc-stars{font-size:11px;color:var(--warm);margin-top:3px;letter-spacing:1px;}

/* ── Timeline ── */
.tl{position:relative;padding-left:28px;}
.tl::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:2px;background:linear-gradient(to bottom,var(--accent),var(--border));}
.tl-item{position:relative;margin-bottom:16px;}
.tl-item::before{content:"";position:absolute;left:-24px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent);box-shadow:0 0 0 3px var(--bg),var(--glow);}
.tl-event-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;transition:border-color .15s;}
.tl-event-card:hover{border-color:var(--accent);}
.tl-item .when{color:var(--accent2);font-size:11px;font-weight:600;margin-bottom:3px;font-family:Menlo,Consolas,monospace;}
.tl-item h4{font-size:13.5px;font-weight:600;}
.tl-item .desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55;}

/* ── Risk Cards ── */
.risk{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;}
.risk-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px;border-left:4px solid var(--muted);transition:all .2s;}
.risk-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.risk-card.r{border-left-color:var(--red);background:rgba(239,68,68,0.04);}
.risk-card.y{border-left-color:var(--yellow);background:rgba(234,179,8,0.04);}
.risk-card.g{border-left-color:var(--green);background:rgba(16,185,129,0.04);}
.risk-card.b{border-left-color:var(--purple);background:rgba(167,139,250,0.06);}
.risk-card h4{font-size:13.5px;margin-bottom:7px;font-weight:700;}
.risk-card p{font-size:12.5px;color:var(--muted);line-height:1.6;}
.risk-card .src{font-size:10.5px;color:var(--muted);opacity:.65;margin-top:8px;display:block;}

/* ── Data Tables ── */
.dtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;overflow-x:auto;display:block;}
.dtable th,.dtable td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:center;white-space:nowrap;}
.dtable thead th{background:linear-gradient(135deg,var(--panel2),var(--panel));color:var(--accent2);font-weight:700;font-size:11.5px;letter-spacing:.3px;border-top:1px solid var(--border);}
.dtable tbody tr:nth-child(even) td{background:rgba(59,130,246,0.04);}
.dtable tbody tr:hover td{background:rgba(59,130,246,0.10);}
.dtable td.f{text-align:left;color:var(--text);background:var(--panel);font-weight:600;position:sticky;left:0;border-right:1px solid var(--border);}
.dtable .hl{color:var(--warm);font-weight:700;}
.dtable .choke{color:var(--purple);font-weight:700;}

/* ── Score Matrix ── */
.smatrix{width:100%;border-collapse:collapse;font-size:12.5px;}
.smatrix th,.smatrix td{border-bottom:1px solid var(--border);padding:9px 11px;text-align:left;}
.smatrix thead th{background:linear-gradient(135deg,var(--panel2),var(--panel));color:var(--accent2);font-weight:700;cursor:pointer;user-select:none;font-size:11.5px;}
.smatrix thead th:hover{color:var(--warm);}
.smatrix tbody tr:hover td{background:rgba(59,130,246,0.06);}
.sbar{display:inline-block;height:7px;border-radius:4px;background:var(--accent);vertical-align:middle;}
.sbar.c{background:var(--accent2);}.sbar.b{background:var(--warm);}
.smatrix .tot{font-weight:800;color:var(--warm);font-size:13.5px;}

/* ── View Toggle & Sort ── */
.viewtoggle{display:flex;gap:6px;margin-bottom:14px;}
.viewtoggle .vbtn{padding:5px 16px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:12px;color:var(--muted);background:var(--panel);transition:all .18s;}
.viewtoggle .vbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.sortsel{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 11px;border-radius:8px;font-size:12px;outline:none;}
.refresh-btn{background:rgba(34,211,238,0.10);border:1px solid rgba(34,211,238,0.35);color:var(--cyan);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;}
.refresh-btn:hover:not(:disabled){background:rgba(34,211,238,0.18);box-shadow:var(--glow2);}
.refresh-btn:disabled{opacity:.6;cursor:wait;}
.quote-status{font-family:Menlo,Consolas,monospace;}

/* ── Serenity (卡口下钻) ── */
.choke-hero{background:linear-gradient(135deg,rgba(167,139,250,0.10),var(--panel));border:1px solid rgba(167,139,250,0.30);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.choke-hero h2{font-size:17px;color:var(--purple);font-weight:700;margin-bottom:8px;letter-spacing:.3px;}
.choke-hero .lead{font-size:13px;color:var(--muted);line-height:1.7;}
.choke-hero .lead em{color:var(--purple);font-style:normal;font-weight:700;}

.tree{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;white-space:pre;overflow-x:auto;line-height:1.65;}
.tree mark{background:rgba(167,139,250,0.18);color:var(--purple);padding:0 4px;border-radius:3px;}

.qa-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
.qa-table th,.qa-table td{border-bottom:1px solid var(--border);padding:9px 11px;text-align:left;vertical-align:top;}
.qa-table thead th{background:var(--panel2);color:var(--accent2);font-weight:700;font-size:11.5px;}
.qa-table .y{color:#34d399;font-weight:700;}
.qa-table .n{color:var(--muted);}
.qa-table .choke-hit{background:rgba(167,139,250,0.10);font-weight:700;color:var(--purple);}

.deep-card{background:linear-gradient(135deg,rgba(167,139,250,0.06),var(--panel));border:1px solid rgba(167,139,250,0.30);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.deep-card h4{font-size:15.5px;color:var(--purple);font-weight:800;margin-bottom:10px;}
.deep-card .reason{margin:10px 0;font-size:12.5px;color:var(--muted);line-height:1.7;}
.deep-card .reason b{color:var(--text);}
.deep-card .targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.deep-card .targets .pill{background:rgba(167,139,250,0.10);border:1px solid rgba(167,139,250,0.32);color:var(--purple);padding:4px 11px;border-radius:14px;font-size:12px;font-weight:600;}
.deep-card .targets .pill.cn{background:rgba(59,130,246,0.10);border-color:rgba(59,130,246,0.4);color:var(--accent2);}

.demur{background:rgba(167,139,250,0.05);border:1px dashed rgba(167,139,250,0.4);border-radius:var(--radius-sm);padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px;}
.demur b{color:var(--purple);}

footer{text-align:center;color:var(--muted);font-size:11px;margin-top:40px;padding-top:20px;border-top:1px solid var(--border);}
@media(max-width:720px){.cards{grid-template-columns:1fr;}.search{width:100%;}}
</style>
</head>
<body data-theme="dark">
<div class="wrap">
<header>
<div>
<h1>{{TOPIC}}产业链投研看板<span class="sub">{{SUB_TITLE}}</span></h1>
</div>
<div class="toolbar">
<span style="color:var(--muted);font-size:12px;">数据截止 {{SNAPSHOT_DATE}}</span>
<button class="btn" id="themeBtn">☾ 暗 / 亮</button>
</div>
</header>
<nav class="tabs">
<div class="tab active" data-tab="overview">概览</div>
<div class="tab" data-tab="chain">产业链</div>
<div class="tab" data-tab="companies">公司速查</div>
<div class="tab" data-tab="timeline">时间轴</div>
<div class="tab" data-tab="risk">风险与逻辑</div>
<div class="tab serenity" data-tab="serenity">🎯 卡口下钻</div>
</nav>
<div id="root"></div>
<footer>
基于 Kimi CLI 提炼的 {{N_SYNTHESIS}} 份合成报告 · {{N_COMPANIES}} 家行情来自腾讯财经 · 弹性测算与情景为派生量级估算（置信度中），bear case 与 serenity 卡口含分析师补充观点 · 单文件零依赖 · 数据截止 {{SNAPSHOT_DATE}}
</footer>
</div>
<script>
/* ========================================================
 * 数据数组（生成时按 references/data-schema.md 填充）
 * ========================================================
 * 必填 5 数组: OVERVIEW / CHAIN / COMPANIES / TIMELINE / RISKS
 * 扩展 B-E: SCORES / GENERATIONS / ELASTICITY / SCENARIOS
 * 扩展 H (serenity 卡口下钻): SERENITY_TREE / DEEP_CHOKES / CHOKE_PURGE / CONFIDENCE / SERENITY_DEMUR
 *
 * 不启用扩展时，相应的 Tab 在 nav 里删掉、PANELS 字典里也删掉。
 * ======================================================== */
const SNAPSHOT_DATE = '{{SNAPSHOT_DATE}}';

/* TODO: 按 references/data-schema.md 填充以下数组 */
const OVERVIEW = { tagline:'', badges:[], inflections:[], logics:[] };
const CHAIN = [];
const COMPANIES = [];
const TIMELINE = [];
const RISKS = [];

/* 可选扩展（不用就整段删除）*/
const SCORES = [];                        // 扩展 B：三维评分矩阵
const GENERATIONS = { cols:[], rows:[], note:'' };  // 扩展 E：多代际对比

const SCENARIOS = { rows:[], note:'' };   // 扩展 D：bear/base/bull 三情景

function priceLine(c){
  if(c.price==null) return `<div class="cc-quote"><span style="color:var(--muted)">${c.note||'行情数据另查'}</span></div>`;
  const upCls = c.change>=0?'up':'down';
  const sign = c.change>=0?'+':'';
  let fmtCap = '—';
  if(c.marketCap!=null){
    fmtCap = c.marketCap>=10000?(c.marketCap/10000).toFixed(2)+'万亿'
           : c.marketCap>=1000?(c.marketCap/1000).toFixed(2)+'千亿'
           : (c.marketCap.toFixed(0)+'亿');
  }
  const fmtChg = (v)=>v==null?'—':`<span class="${v>=0?'up':'down'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
  const dynPeStr = (c.dynPe==null)?'—':(c.dynPe<0?'<span style="color:#f87171">负(亏损)</span>':c.dynPe.toFixed(1));
  // ROE：腾讯接口不返回，预留占位；外部数据接入后批量补 c.roe
  const roeStr = (c.roe==null)?'<span style="color:var(--muted)">—</span>'
                              :(c.roe<0?`<span style="color:#f87171">${c.roe.toFixed(1)}%</span>`
                                       :(c.roe>=15?`<span style="color:#34d399">${c.roe.toFixed(1)}%</span>`
                                                  :`${c.roe.toFixed(1)}%`));
  const pegColor = c.peg==null?'var(--muted)':c.peg>3?'#f87171':c.peg<1?'#34d399':'var(--accent2)';
  const pegStr = c.peg==null?'N/A':c.peg.toFixed(2);
  const growthStr = c.pegGrowth==null?'—':c.pegGrowth.toFixed(1)+'%';
  let posLine = '';
  if(c.pos52w!=null){
    const pct = c.pct52w!=null?c.pct52w:50;
    posLine = `<div class="cc-pos">
      <span>距52周高 <b style="color:${c.pos52w>-8?'#f87171':(c.pos52w<-30?'#34d399':'var(--text)')}">${c.pos52w.toFixed(1)}%</b></span>
      <span>52周分位 <span class="bar"><i style="left:${pct}%"></i></span> ${pct}%</span>
    </div>`;
  }
  return `<div class="cc-quote">
    <span>价 <b>${c.price.toFixed(2)}</b></span>
    <span>日 <b class="${upCls}">${sign}${c.change.toFixed(2)}%</b></span>
    <span>5日 ${fmtChg(c.chg5d)}</span>
    <span>20日 ${fmtChg(c.chg20d)}</span>
    <span>动态PE <b>${dynPeStr}</b></span>
    <span title="净资产收益率（加权平均 ROE）">ROE <b>${roeStr}</b></span>
    <span title="预期净利润增速 ${growthStr}">PEG <b style="color:${pegColor}">${pegStr}</b></span>
    <span>市值 <b>${fmtCap}</b></span>
  </div>${posLine}`;
}
function star(n){return '★'.repeat(n)+'☆'.repeat(5-n);}
function valTagHtml(c){
  if(c.price==null || !c.valTag) return '';
  return `<span class="vtag ${c.valTag}">${c.valLbl}</span>`;
}

/* ── Render: Companies ── */
let CUR_SEG='all', CUR_TIER='all', CUR_KW='', CUR_VIEW='cards', CUR_SORT='default', SCORE_SORT='total';

function sortCompanies(arr){
  const a=[...arr];
  const num=(v)=>v==null?-Infinity:v;
  switch(CUR_SORT){
    case 'chg20d': a.sort((x,y)=>num(y.chg20d)-num(x.chg20d)); break;
    case 'pe': a.sort((x,y)=>{
      const px=(x.dynPe==null||x.dynPe<0)?Infinity:x.dynPe;
      const py=(y.dynPe==null||y.dynPe<0)?Infinity:y.dynPe;
      return px-py;
    }); break;
    case 'mcap': a.sort((x,y)=>num(y.marketCap)-num(x.marketCap)); break;
    case 'pos': a.sort((x,y)=>num(x.pos52w)-num(y.pos52w)); break;
    case 'roe': a.sort((x,y)=>{
      // ROE 高→低；null 沉底
      const rx = x.roe==null ? -Infinity : x.roe;
      const ry = y.roe==null ? -Infinity : y.roe;
      return ry - rx;
    }); break;
    case 'rating': a.sort((x,y)=>y.rating-x.rating||x.tier-y.tier); break;
    default: break;
  }
  return a;
}
function renderCompanies(){
  const segs = ['all','integration','power_device','magnetic','transformer','control_ic','application','overseas'];
  const tiers = ['all',1,2,3];
  let filtered = COMPANIES.filter(c=>{
    if(CUR_SEG!=='all' && c.seg!==CUR_SEG) return false;
    if(CUR_TIER!=='all' && c.tier!==CUR_TIER) return false;
    if(CUR_KW){
      const kw = CUR_KW.toLowerCase();
      const hay = (c.name+c.code+c.highlights+(c.tags||[]).join('')+(c.customers||[]).join('')).toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
  filtered = sortCompanies(filtered);
  const viewBar = `
    <div class="viewtoggle">
      <div class="vbtn ${CUR_VIEW==='cards'?'on':''}" data-view="cards">📇 公司卡片</div>
      <div class="vbtn ${CUR_VIEW==='matrix'?'on':''}" data-view="matrix">📊 三维评分矩阵</div>
    </div>`;
  if(CUR_VIEW==='matrix') return viewBar + renderMatrix();
  const sortBar = `
    <select class="sortsel" id="sortSel">
      <option value="default" ${CUR_SORT==='default'?'selected':''}>默认（环节/梯队）</option>
      <option value="rating" ${CUR_SORT==='rating'?'selected':''}>按综合星级</option>
      <option value="chg20d" ${CUR_SORT==='chg20d'?'selected':''}>按 20 日涨幅</option>
      <option value="pe" ${CUR_SORT==='pe'?'selected':''}>按动态 PE（低→高）</option>
      <option value="roe" ${CUR_SORT==='roe'?'selected':''}>按 ROE（高→低）</option>
      <option value="pos" ${CUR_SORT==='pos'?'selected':''}>按距 52 周高（回调深→浅）</option>
      <option value="mcap" ${CUR_SORT==='mcap'?'selected':''}>按市值</option>
    </select>
    <button class="btn refresh-btn" id="refreshQuotesBtn" title="一键拉取腾讯财经最新行情（A股/港股/美股）">🔄 刷新行情</button>`;
  return viewBar + `
    <div class="filters">
      <span style="color:var(--muted);font-size:12px;">环节：</span>
      ${segs.map(s=>`<div class="chip ${CUR_SEG===s?'on':''}" data-filter-seg="${s}">${s==='all'?'全部':SEG_NAMES[s]||s}</div>`).join('')}
    </div>
    <div class="filters">
      <span style="color:var(--muted);font-size:12px;">梯队：</span>
      ${tiers.map(t=>`<div class="chip ${CUR_TIER===t?'on':''}" data-filter-tier="${t}">${t==='all'?'全部':TIER_NAMES[t]}</div>`).join('')}
      <input class="search" id="kwSearch" placeholder="搜索公司/代码/客户/技术..." value="${CUR_KW}">
      ${sortBar}
      <span class="quote-status" id="quoteStatus" style="color:var(--muted);font-size:11.5px;margin-left:auto;">数据截止 ${SNAPSHOT_DATE}</span>
      <span style="color:var(--muted);font-size:12px;">共 ${filtered.length} / ${COMPANIES.length} 家</span>
    </div>
    <div class="cards">
      ${filtered.map(c=>{
        const isUnlisted = c.price==null;
        const tags = c.tags||[];
        return `
        <div class="cc tier-card-${c.tier} ${isUnlisted?'unlisted':''}" data-code="${c.code}">
          <div class="cc-inner">
            <div class="cc-head">
              <div>
                <div class="cc-name">${c.name}${valTagHtml(c)}</div>
                <div class="cc-code">${c.code}.${MKT_NAMES[c.mkt]||c.mkt}</div>
              </div>
              <div style="text-align:right;">
                <span class="tier tier-${c.tier}">${TIER_NAMES[c.tier]}</span>

                const cls = (t.indexOf('🎯')>=0)?'tag choke':'tag';
                return `<span class="${cls}">${t}</span>`;

            <div class="cc-detail">

function renderMatrix(){
  const rows=[...SCORES].sort((a,b)=>{
    if(SCORE_SORT==='v') return b.v-a.v;
    if(SCORE_SORT==='c') return b.c-a.c;
    if(SCORE_SORT==='b') return b.b-a.b;
    return b.total-a.total;
  });
  const bar=(val,cls)=>val==null?'—':`<span class="sbar ${cls}" style="width:${val/5*46}px"></span> ${val.toFixed(1)}`;
  return `
    <p style="color:var(--muted);font-size:12.5px;margin-bottom:10px;">三维评分（5 分制，来自 03_标的画像）：<b style="color:var(--accent)">价值量弹性</b> · <b style="color:var(--accent2)">客户确定性</b> · <b style="color:var(--warm)">国产化壁垒</b>。点表头切换排序。</p>
    <div class="card" style="padding:6px 12px;">
    <table class="smatrix">
      <thead><tr>
        <th>公司 / 环节</th>
        <th data-score="v">价值量弹性 ▾</th>
        <th data-score="c">客户确定性 ▾</th>
        <th data-score="b">国产化壁垒 ▾</th>
        <th data-score="total">综合 ▾</th>
        <th>评语</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td><b>${r.name}</b><br><span style="color:var(--muted);font-size:11px;">${r.code} · ${SEG_NAMES[r.seg]||r.seg}</span></td>
          <td>${bar(r.v,'')}</td>
          <td>${bar(r.c,'c')}</td>
          <td>${bar(r.b,'b')}</td>
          <td class="tot">${r.total.toFixed(1)}</td>
          <td style="color:var(--muted);font-size:11.5px;max-width:240px;white-space:normal;">${r.note||''}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>`;
}

      <b>⚠ 特别说明：</b>本 Tab 是 serenity"把龙头当入口、溯游而上找卡口"方法论的产物，<b>不是研报共识</b>。卡口候选可能因技术迭代、新进入者扩产或下游方案变更而失效。本视角与"概览/产业链"Tab 形成对照——
      04 行业白皮书选出的核心标的（金盘/麦格米特/科士达/盛弘）是<b>整机+下游</b>视角，05 卡口选出的（天岳/云路/士兰/华润微）是<b>上游+材料</b>视角，两者几乎不重合。投资决策需结合公司公告、订单披露与估值节奏独立判断，<b style="color:var(--purple)">不构成投资建议</b>。
    </div>
  `;
}

/* === Mount === */
const PANELS = {
  overview:renderOverview, chain:renderChain, companies:renderCompanies,
  timeline:renderTimeline, risk:renderRisk, serenity:renderSerenity
};
let curTab = 'overview';
function mount(){
  document.getElementById('root').innerHTML = `<div class="panel active">${PANELS[curTab]()}</div>`;
  bindPanelEvents();
}
function bindPanelEvents(){
  document.querySelectorAll('.node').forEach(el=>{
    el.addEventListener('click',()=>{
      const seg = el.dataset.seg;
      if(SEG_NAMES[seg]){
        CUR_SEG = seg;
        CUR_TIER = 'all';
        switchTab('companies');
      }
    });
  });
  document.querySelectorAll('[data-filter-seg]').forEach(el=>{
    el.addEventListener('click',()=>{
      CUR_SEG = el.dataset.filterSeg==='all'?'all':el.dataset.filterSeg;
      mount();
    });
  });
  document.querySelectorAll('[data-filter-tier]').forEach(el=>{
    el.addEventListener('click',()=>{
      const v = el.dataset.filterTier;
      CUR_TIER = v==='all'?'all':parseInt(v);
      mount();
    });
  });
  const sb = document.getElementById('kwSearch');
  if(sb){
    sb.addEventListener('input',(e)=>{
      CUR_KW=e.target.value;
      const v=e.target.selectionStart;
      mount();
      const s=document.getElementById('kwSearch');
      if(s){s.focus(); s.setSelectionRange(v,v);}
    });
  }
  document.querySelectorAll('.cc').forEach(el=>{
    el.addEventListener('click',(e)=>{
      if(e.target.tagName==='INPUT')return;
      el.classList.toggle('open');
    });
  });
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click',()=>{ CUR_VIEW=el.dataset.view; mount(); });
  });
  const ss=document.getElementById('sortSel');
  if(ss) ss.addEventListener('change',(e)=>{ CUR_SORT=e.target.value; mount(); });
  const rb=document.getElementById('refreshQuotesBtn');
  if(rb) rb.addEventListener('click',()=>refreshQuotes());
  document.querySelectorAll('[data-score]').forEach(el=>{
    el.addEventListener('click',()=>{ SCORE_SORT=el.dataset.score; mount(); });
  });
}

/* ── Refresh Quotes（扩展 I）：浏览器直连腾讯财经接口拉最新行情 ── */
/* 仅刷新 A 股 / 港股 / 美股 (price != null)；未上市标的跳过；ROE 字段不动 */
async function refreshQuotes(){
  const btn = document.getElementById('refreshQuotesBtn');
  const status = document.getElementById('quoteStatus');
  if(btn){ btn.disabled = true; btn.textContent = '🔄 刷新中…'; }
  if(status) status.textContent = '正在拉取腾讯接口…';

  // 准备代码 + 市场前缀
  const tencentPrefix = (c)=>{
    if(c.mkt==='HK') return 'hk'+c.code;
    if(c.mkt==='US') return 'us'+c.code;
    if(c.code.startsWith('6')||c.code.startsWith('9')) return 'sh'+c.code;
    if(c.code.startsWith('8')) return 'bj'+c.code;
    return 'sz'+c.code;
  };
  const targets = COMPANIES.filter(c=>c.price!=null && ['SH','SZ','BJ','HK','US'].includes(c.mkt));
  const codeMap = {};
  targets.forEach(c=>{ codeMap[tencentPrefix(c)] = c; });

  // 1. 批量实时行情（GBK），单批 20 只
  const allPrefixed = Object.keys(codeMap);
  const batchSize = 20;
  let okCount = 0;
  for(let i=0; i<allPrefixed.length; i+=batchSize){
    const batch = allPrefixed.slice(i, i+batchSize);
    try{
      const url = 'https://qt.gtimg.cn/q='+batch.join(',');
      const resp = await fetch(url);
      const buf = await resp.arrayBuffer();
      const text = new TextDecoder('gbk').decode(buf);
      text.split('\n').forEach(line=>{
        const m = line.match(/v_([a-z]{2}\d{5,6})="([^"]+)"/i);
        if(!m) return;
        const c = codeMap[m[1]];
        if(!c) return;
        const v = m[2].split('~');
        if(v.length < 50) return;
        const flt = (s)=>{ if(!s||s==='-'||s==='--')return null; const n=parseFloat(s); return isNaN(n)?null:n; };
        c.price = flt(v[3]);
        c.change = flt(v[32]);
        const ttmPe = flt(v[39]);
        c.dynPe = (ttmPe!=null && Math.abs(ttmPe)<1e6) ? ttmPe : null;
        c.marketCap = flt(v[44]);
        // 注意：ROE 不在腾讯返回里，保持 c.roe 不变
        okCount++;
      });
    }catch(e){ console.warn('quote batch fail:', e); }
  }

  // 2. K 线接口算 5d/20d/52周
  if(status) status.textContent = `行情已更新 ${okCount} 家，正在拉 K 线…`;
  let klOk = 0;
  await Promise.all(targets.map(async c=>{
    try{
      const p = tencentPrefix(c);
      const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${p},day,,,260,qfq`;
      const r = await fetch(url);
      const j = await r.json();
      const node = (j.data||{})[p] || {};
      const k = node.qfqday || node.day || node.kline || [];
      if(k.length < 5) return;
      const last = parseFloat(k[k.length-1][2]);
      const c5 = k.length>=5 ? parseFloat(k[k.length-5][2]) : last;
      const c20 = k.length>=20 ? parseFloat(k[k.length-20][2]) : last;
      c.chg5d = c5? ((last-c5)/c5*100) : null;
      c.chg20d = c20? ((last-c20)/c20*100) : null;
      const closes = k.map(x=>parseFloat(x[2])).filter(x=>!isNaN(x));
      if(closes.length){
        const hi = Math.max(...closes), lo = Math.min(...closes);
        c.pos52w = hi? ((last-hi)/hi*100) : null;
        c.pct52w = (hi!==lo) ? Math.round((last-lo)/(hi-lo)*100) : 50;
        // 重算估值温度
        if(c.dynPe==null || c.dynPe<0){ c.valTag='warm'; c.valLbl=c.dynPe<0?'亏损':'PE缺失'; }
        else if(c.dynPe>=200){ c.valTag='hot'; c.valLbl='PE极高'; }
        else if(c.dynPe>=60 && c.pos52w>-8){ c.valTag='hot'; c.valLbl='高位高估'; }
        else if(c.dynPe>=60){ c.valTag='warm'; c.valLbl='偏高'; }
        else if(c.pos52w<-30){ c.valTag='low'; c.valLbl='深度回调'; }
        else { c.valTag='fair'; c.valLbl='相对合理'; }
      }
      klOk++;
    }catch(e){ console.warn('kline fail:', c.code, e); }
  }));

  if(btn){ btn.disabled = false; btn.textContent = '🔄 刷新行情'; }
  const now = new Date();
  const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')
           +' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(status) status.textContent = `已更新 ${okCount}/${targets.length} 家 · 实时刷新于 ${ts}`;
  mount();
}
function switchTab(name){
  curTab = name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  mount();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur = document.body.dataset.theme;
  document.body.dataset.theme = cur==='dark'?'light':'dark';
});

mount();

</script>
